# ============================================================
# 自动部署到 GitHub Pages
# 触发：每次 push 到 main 分支
# 流程：安装依赖 → 类型检查与构建 → 复制 404.html（SPA 刷新
#       兜底，GitHub Pages 对 404 返回 index.html 内容）→ 发布
# 首次使用：仓库 Settings → Pages → Source 选 gh-pages 分支
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build

      - name: 复制 404.html（SPA 刷新兜底）
        run: cp dist/index.html dist/404.html

      - name: 部署到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
